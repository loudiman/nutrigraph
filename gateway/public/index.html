<!doctype html>
<!--
  The client. It exists for one reason beyond typing a message: the
  demo-data-only warning has to reach a User before they type, and ADR 0002
  rests on that warning rather than on the schema. Keep it above the box —
  warning.test.ts fails otherwise.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>NutriGraph</title>
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAF9FB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131118" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="NutriGraph" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <img src="/icons/icon.svg" alt="" width="20" height="20" />
      <span class="wordmark">NutriGraph</span>
    </header>

    <main id="thread" aria-live="polite">
      <div id="empty" hidden>
        <p class="hello">Tell the Coach what you ate, or ask it something.</p>
        <div class="examples">
          <button type="button">I ate two eggs and pandesal</button>
          <button type="button">How much protein do I need?</button>
          <button type="button">How is my day looking?</button>
        </div>
      </div>
    </main>

    <footer>
      <details id="warning" open>
        <summary>Demo data only.</summary>
        <p>
          What you type is stored as written and kept for 90 days, so do not
          enter real personal or health details, yours or anyone else's.
        </p>
      </details>
      <p id="status" role="status"><span class="dot"></span><span id="status-text"></span></p>
      <form id="ask">
        <input id="message" name="message" autocomplete="off" enterkeyhint="send"
               placeholder="Message the Coach" aria-label="Message the Coach" />
        <button id="send" aria-label="Send">Send</button>
      </form>
    </footer>

    <script type="module" src="/client.js"></script>
  </body>
</html>
