# Every pull request. A failure here blocks the merge; nothing is deployed and
# no pull request is ever verified against a deployed copy.
steps:
  # A throwaway PostgreSQL, so the migration, seed and checkpointer assertions
  # run for real instead of skipping. Never Neon: its free tier is a ceiling.
  - name: gcr.io/cloud-builders/docker
    id: postgres
    args:
      - run
      - -d
      - --name=postgres
      - --network=cloudbuild
      - -e=POSTGRES_USER=nutrigraph
      - -e=POSTGRES_PASSWORD=nutrigraph
      - -e=POSTGRES_DB=nutrigraph_test
      - pgvector/pgvector:pg17

  - name: python:3.13-slim
    id: agent
    dir: agent
    env:
      - NUTRIGRAPH_TEST_DATABASE_URL=postgresql://nutrigraph:nutrigraph@postgres:5432/nutrigraph_test
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        pip install --quiet -e ".[dev]"
        for _ in $(seq 60); do (echo > /dev/tcp/postgres/5432) 2>/dev/null && break; sleep 1; done
        pytest -q

  - name: node:24-slim
    id: gateway
    dir: gateway
    entrypoint: bash
    args:
      - -c
      - npm ci && npm test && npm run typecheck

  # The eval gate, after the two seams and before the merge. It runs the real
  # graph against the golden dataset on the same throwaway PostgreSQL — the same
  # router, rule list, Corpus search, composer and release gate a User reaches —
  # and blocks on a missed Refusal, a missing Citation, an allergen in an answer
  # or a schema failure.
  #
  # No `--group` and no `--case`. A run that names its cases is a skip list with
  # the sign flipped, and there is no quarantine list here.
  #
  # LANGSMITH_ENDPOINT is required, not a default worth trusting. This account
  # is on the APAC data plane, and the SDK's US default answers a valid key with
  # a 403 on every call, tracing writes included.
  #
  # The run paces itself to the key's quota, and the key is on the free tier:
  # fifteen `generateContent` calls a minute per model against the hundred and
  # fifty a full run makes. That is about ten minutes, and it is the quota's
  # number rather than the harness's — see `agent/evals/README.md`. Putting
  # billing on the key and adding `--requests-per-minute 0` below is what buys
  # the couple of minutes issue #22 asked for; it is a decision for a person.
  - name: python:3.13-slim
    id: eval
    dir: agent
    env:
      - DATABASE_URL=postgresql://nutrigraph:nutrigraph@postgres:5432/nutrigraph_test
      - LANGSMITH_TRACING=true
      - LANGSMITH_ENDPOINT=https://apac.api.smith.langchain.com
    secretEnv: ['GOOGLE_API_KEY', 'LANGSMITH_API_KEY']
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        pip install --quiet -e .
        python -m evals.run \
          --rows /workspace/eval-rows.json \
          --outcomes /workspace/eval-outcomes.json

  # The judge, in an environment of its own. ragas 0.4 needs a
  # langchain-community that the agent's langchain 1.x cannot sit beside, so the
  # two halves of a run are two containers rather than one dependency set that
  # resolves to neither. It reads the rows the step above wrote and imports
  # nothing from the agent.
  #
  # Only the retrieval group is here, which is what keeps a whole run at a few
  # cents: the safety and behaviour groups are plain assertions, and safety is
  # never judged by a model at all.
  - name: python:3.12-slim
    id: judge
    dir: agent
    secretEnv: ['GOOGLE_API_KEY']
    entrypoint: bash
    args:
      - -c
      - |
        set -eu
        pip install --quiet -r evals/requirements-judge.txt
        python -m evals.judge /workspace/eval-rows.json \
          --scores /workspace/eval-scores.json \
          --no-write-baseline

availableSecrets:
  secretManager:
    - versionName: projects/nutrigraph-2026ldm/secrets/gemini-api-key/versions/latest
      env: GOOGLE_API_KEY
    - versionName: projects/nutrigraph-2026ldm/secrets/langsmith-api-key/versions/latest
      env: LANGSMITH_API_KEY

serviceAccount: projects/nutrigraph-2026ldm/serviceAccounts/nutrigraph-build@nutrigraph-2026ldm.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
# The two seams take about a minute between them; the eval gate takes about ten,
# because the free tier's quota says so. Half an hour left no room for a slow
# case, and a build that is killed mid-run reads as a broken gate.
timeout: 3600s
