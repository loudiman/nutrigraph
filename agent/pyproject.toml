[project]
name = "nutrigraph-agent"
version = "0.1.0"
description = "NutriGraph agent service: the graph, the nodes, and the migrations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain>=1.0",
    # The provider is a configuration string. Swapping it is one line in `.env`
    # and the matching package here; no code path names a vendor.
    "langchain-google-genai>=3.0",
    # The Corpus ingest: fetch, and read the PDFs among the forty documents.
    "httpx>=0.28",
    "pypdf>=6.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28"]
# Open-ended entities — the names of other people, and street addresses no
# regular expression catches. Without it, only names the Coach already holds
# are redacted; see `redaction.entity_name_finder`.
ner = ["spacy>=3.8"]

[project.scripts]
nutrigraph-migrate = "nutrigraph_agent.migrate:main"
nutrigraph-seed = "nutrigraph_agent.seed:main"
# The slow step of the seed sequence, and therefore its own command.
nutrigraph-ingest = "nutrigraph_agent.ingest:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
