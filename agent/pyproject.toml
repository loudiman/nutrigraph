[project]
name = "nutrigraph-agent"
version = "0.1.0"
description = "NutriGraph agent service: the graph, the nodes, and the migrations."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "psycopg[binary,pool]>=3.3",
    "pydantic>=2.13",
    "python-dotenv>=1.2",
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "httpx>=0.28"]

[project.scripts]
nutrigraph-migrate = "nutrigraph_agent.migrate:main"
nutrigraph-seed = "nutrigraph_agent.seed:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
